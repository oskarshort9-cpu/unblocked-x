
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #10111b;
    color: white;
    font-family: Arial, sans-serif;
}

.notice {
    background: #24243a;
    padding: 14px;
    text-align: center;
    border-bottom: 2px solid #6366f1;
    font-size: 14px;
}

header {
    text-align: center;
    padding: 30px 15px;
    background: #181927;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    color: #aaa;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.game-card {
    background: #1c1e2d;
    border: 1px solid #33364c;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 25px;
}

.game-card h2 {
    margin-top: 0;
}

.game-frame {
    width: 100%;
    height: 500px;
    background: #090a10;
    border: 1px solid #41445c;
    border-radius: 10px;
    overflow: hidden;
}

.game-frame iframe {
    width: 100%;
    height: 100%;
    border: none;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    background: #6366f1;
    color: white;
    border: none;
    border-radius: 9px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #4f46e5;
}

footer {
    text-align: center;
    color: #777;
    padding: 30px;
}
</style>
</head>

<body>

<div class="notice">
If a teacher is reviewing this website, all of the students are playing when it's free time, don't block this website please! - Oskar Short
</div>

<header>
    <h1>🎮 Unblocked X</h1>
    <p>Your personal gaming collection</p>
</header>

<div class="container">
    <h2>🎮 Game Library</h2>
    <div id="games"></div>
</div>

<footer>
    © 2026 Oskar's Unblocked Games
</footer>

<script>

// =====================================
// ADD NEW GAMES HERE!
// Just add a name and a website URL.
// =====================================

const games = [
    {
        name: "TikTok",
        url: "https://www.runapps.org/runcommunity/tiktok/create-tiktok.php"
    }

    // ADD MORE GAMES BELOW:
    // {
    //     name: "Game Name",
    //     url: "https://example.com"
    // }

];

// =====================================
// GAME DISPLAY SYSTEM
// =====================================

const gameContainer = document.getElementById("games");

games.forEach((game, index) => {

    const card = document.createElement("div");
    card.className = "game-card";

    const title = document.createElement("h2");
    title.textContent = game.name;

    const number = document.createElement("p");
    number.textContent = "Game " + (index + 1);

    const frame = document.createElement("div");
    frame.className = "game-frame";

    const iframe = document.createElement("iframe");
    iframe.src = game.url;
    iframe.title = game.name;
    iframe.loading = "lazy";
    iframe.referrerPolicy = "strict-origin-when-cross-origin";
    iframe.allowFullscreen = true;

    frame.appendChild(iframe);

    const button = document.createElement("button");
    button.textContent = "Unblock it!";

    button.addEventListener("click", () => {
        const newTab = window.open("about:blank", "_blank");

        if (!newTab) {
            alert("Please allow pop-ups for this website.");
            return;
        }

        const newFrame = newTab.document.createElement("iframe");
        newFrame.src = game.url;
        newFrame.style.cssText =
            "position:fixed;inset:0;width:100%;height:100%;border:0";

        newTab.document.body.style.margin = "0";
        newTab.document.body.appendChild(newFrame);
        newTab.document.title = game.name;
    });

    card.appendChild(title);
    card.appendChild(number);
    card.appendChild(frame);
    card.appendChild(button);

    gameContainer.appendChild(card);
});

</script>

</body>
</html>
